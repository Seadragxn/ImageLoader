<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title description">
  <title id="title">Image Loader for Terraria</title>
  <desc id="description">Blue and purple pixel-art banner for the Image Loader tModLoader mod.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071735"/>
      <stop offset="0.48" stop-color="#243b94"/>
      <stop offset="1" stop-color="#7a2ca3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c71ff"/>
      <stop offset="1" stop-color="#be4cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.72"/>
    </filter>
  </defs>
  <rect width="1400" height="360" fill="url(#sky)"/>
  <g opacity="0.2" fill="#93c5fd">
    <rect x="0" y="296" width="64" height="64"/><rect x="64" y="264" width="64" height="96"/>
    <rect x="128" y="312" width="64" height="48"/><rect x="1170" y="280" width="70" height="80"/>
    <rect x="1240" y="238" width="80" height="122"/><rect x="1320" y="302" width="80" height="58"/>
  </g>
  <g opacity="0.24" fill="#c4b5fd">
    <rect x="110" y="58" width="16" height="16"/><rect x="150" y="82" width="12" height="12"/>
    <rect x="1188" y="64" width="14" height="14"/><rect x="1240" y="100" width="9" height="9"/>
    <rect x="1040" y="44" width="8" height="8"/><rect x="318" y="92" width="8" height="8"/>
  </g>
  <g transform="translate(125 72)" filter="url(#shadow)">
    <rect width="216" height="216" rx="28" fill="#101a38" stroke="url(#panel)" stroke-width="8"/>
    <g transform="translate(34 34)">
      <rect width="148" height="148" fill="#172554"/>
      <rect x="0" y="0" width="37" height="37" fill="#60a5fa"/>
      <rect x="37" y="0" width="37" height="37" fill="#2563eb"/>
      <rect x="74" y="0" width="37" height="37" fill="#7c3aed"/>
      <rect x="111" y="0" width="37" height="37" fill="#a855f7"/>
      <rect x="0" y="37" width="37" height="37" fill="#1d4ed8"/>
      <rect x="37" y="37" width="37" height="37" fill="#38bdf8"/>
      <rect x="74" y="37" width="37" height="37" fill="#818cf8"/>
      <rect x="111" y="37" width="37" height="37" fill="#c084fc"/>
      <rect x="0" y="74" width="37" height="37" fill="#0ea5e9"/>
      <rect x="37" y="74" width="37" height="37" fill="#22d3ee"/>
      <rect x="74" y="74" width="37" height="37" fill="#6366f1"/>
      <rect x="111" y="74" width="37" height="37" fill="#9333ea"/>
      <rect x="0" y="111" width="37" height="37" fill="#0f766e"/>
      <rect x="37" y="111" width="37" height="37" fill="#14b8a6"/>
      <rect x="74" y="111" width="37" height="37" fill="#4f46e5"/>
      <rect x="111" y="111" width="37" height="37" fill="#7e22ce"/>
    </g>
  </g>
  <g transform="translate(410 103)" fill="#f8fafc" filter="url(#shadow)">
    <text x="0" y="75" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="82" font-weight="800" letter-spacing="1">IMAGE LOADER</text>
    <text x="4" y="126" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="27" font-weight="600" fill="#dbeafe">TURN ANY IMAGE INTO A TERRARIA CANVAS</text>
  </g>
  <rect x="410" y="260" width="785" height="5" rx="2.5" fill="url(#panel)"/>
</svg>
